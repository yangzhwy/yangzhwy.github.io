<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}{% unless page.title == 'Main' %} — {{ page.title | escape }}{% endunless %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site">
      <header class="site-header">
        <h1>{{ site.title | escape }}</h1>
      </header>
      <div class="site-layout">
        {% include navigation.html %}
        <main id="main" class="content" tabindex="-1">
          {% if page.portrait %}<img class="portrait" src="{{ page.portrait | relative_url }}" width="259" alt="{{ page.portrait_alt | escape }}">{% endif %}
          {{ content }}
        </main>
      </div>
    </div>
  </body>
</html>
